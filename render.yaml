services:
  - type: web
    name: agri-ai-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MONGO_URL
        sync: false   # set manually in dashboard (your Atlas connection string)
      - key: DB_NAME
        value: plant_ai
      - key: GEMINI_API_KEY
        sync: false
      - key: PLANTNET_KEY
        sync: false
      - key: PORT
        value: 10000
